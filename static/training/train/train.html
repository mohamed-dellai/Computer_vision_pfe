<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Train Data - YOLO AI Server</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/training/shared/training-common.css">
<link rel="stylesheet" href="/static/training/train/train.css">
</head>
<body>
<div class="app-layout">
  <aside class="sidebar">
    <div class="brand"><span>YOLO</span> AI Server</div>
    <nav class="nav-links">
      <a href="/ui/cameras" class="nav-item"><span class="nav-icon">CA</span><span class="nav-text">Cameras</span></a>
      <a href="/ui/models" class="nav-item"><span class="nav-icon">MO</span><span class="nav-text">Models</span></a>
      <a href="/ui/jobs" class="nav-item"><span class="nav-icon">JB</span><span class="nav-text">Jobs</span></a>
      <a href="/ui/trackers" class="nav-item"><span class="nav-icon">TK</span><span class="nav-text">Trackers</span></a>
      <a href="/ui/training" class="nav-item active"><span class="nav-icon">TR</span><span class="nav-text">Training</span></a>
    </nav>
  </aside>

  <main class="main-content">
    <header>
      <div class="page-title">
        <h1>Train Data</h1>
        <p>Start and monitor YOLO training jobs.</p>
      </div>
      <div class="page-actions">
        <a href="/ui/training" class="btn btn-secondary">Training Menu</a>
      </div>
    </header>

    <nav class="workflow-nav">
      <a href="/ui/training/record">Record Data</a>
      <a href="/ui/training/upload">Upload Data</a>
      <a href="/ui/training/annotate">Annotate Data</a>
      <a href="/ui/training/classes">Create Classes</a>
      <a class="active" href="/ui/training/train">Train Data</a>
    </nav>

    <section class="card">
      <h3>Training Setup</h3>
      <div class="train-grid">
        <div class="form-group">
          <label>Dataset</label>
          <select id="train-dataset"></select>
        </div>
        <div class="form-group">
          <label>Annotation Version</label>
          <select id="train-version"></select>
        </div>
        <div class="form-group">
          <label>Model Source</label>
          <select id="train-model"></select>
        </div>
        <div class="form-group">
          <label>Epochs</label>
          <input id="train-epochs" type="number" value="50" />
        </div>
        <div class="form-group">
          <label>Batch Size</label>
          <input id="train-batch" type="number" value="16" />
        </div>
        <div class="form-group">
          <label>Image Size</label>
          <input id="train-imgsz" type="number" value="640" />
        </div>
        <div class="form-group">
          <label>Split Train</label>
          <input id="split-train" type="number" step="0.01" value="0.8" />
        </div>
        <div class="form-group">
          <label>Split Val</label>
          <input id="split-val" type="number" step="0.01" value="0.1" />
        </div>
        <div class="form-group">
          <label>Split Test</label>
          <input id="split-test" type="number" step="0.01" value="0.1" />
        </div>
      </div>

      <div class="augmentation-panel">
        <div class="augmentation-header">
          <label class="toggle-row">
            <input id="aug-enabled" type="checkbox" />
            <span>Custom Augmentation</span>
          </label>
          <div class="augmentation-actions">
            <button id="aug-defaults-btn" type="button" class="btn btn-secondary">YOLO Defaults</button>
            <button id="aug-zero-btn" type="button" class="btn btn-secondary">Zero All</button>
          </div>
        </div>

        <div id="augmentation-controls" class="augmentation-grid">
          <div class="form-group">
            <label>HSV Hue</label>
            <input id="aug-hsv-h" type="number" step="0.001" min="0" max="1" value="0.015" />
          </div>
          <div class="form-group">
            <label>HSV Saturation</label>
            <input id="aug-hsv-s" type="number" step="0.01" min="0" max="1" value="0.7" />
          </div>
          <div class="form-group">
            <label>HSV Value</label>
            <input id="aug-hsv-v" type="number" step="0.01" min="0" max="1" value="0.4" />
          </div>
          <div class="form-group">
            <label>Degrees</label>
            <input id="aug-degrees" type="number" step="0.1" min="0" max="180" value="0" />
          </div>
          <div class="form-group">
            <label>Translate</label>
            <input id="aug-translate" type="number" step="0.01" min="0" max="1" value="0.1" />
          </div>
          <div class="form-group">
            <label>Scale</label>
            <input id="aug-scale" type="number" step="0.01" min="0" max="10" value="0.5" />
          </div>
          <div class="form-group">
            <label>Shear</label>
            <input id="aug-shear" type="number" step="0.1" min="0" max="180" value="0" />
          </div>
          <div class="form-group">
            <label>Perspective</label>
            <input id="aug-perspective" type="number" step="0.0001" min="0" max="1" value="0" />
          </div>
          <div class="form-group">
            <label>Flip Up/Down</label>
            <input id="aug-flipud" type="number" step="0.01" min="0" max="1" value="0" />
          </div>
          <div class="form-group">
            <label>Flip Left/Right</label>
            <input id="aug-fliplr" type="number" step="0.01" min="0" max="1" value="0.5" />
          </div>
          <div class="form-group">
            <label>Mosaic</label>
            <input id="aug-mosaic" type="number" step="0.01" min="0" max="1" value="1" />
          </div>
          <div class="form-group">
            <label>MixUp</label>
            <input id="aug-mixup" type="number" step="0.01" min="0" max="1" value="0" />
          </div>
          <div class="form-group">
            <label>Copy Paste</label>
            <input id="aug-copy-paste" type="number" step="0.01" min="0" max="1" value="0" />
          </div>
          <div class="form-group">
            <label>Erasing</label>
            <input id="aug-erasing" type="number" step="0.01" min="0" max="1" value="0.4" />
          </div>
          <div class="form-group">
            <label>Close Mosaic</label>
            <input id="aug-close-mosaic" type="number" step="1" min="0" max="1000" value="10" />
          </div>
        </div>
      </div>

      <div class="form-row">
        <button id="start-training-btn" class="btn btn-primary">Start Training</button>
        <button id="stop-training-btn" class="btn btn-secondary">Stop Active</button>
      </div>

      <div id="training-status" class="status">No training jobs yet.</div>
      <div id="training-status-detail" class="status-detail"></div>
      <pre id="training-logs" class="logs"></pre>
    </section>
  </main>
</div>

<script src="/static/training/shared/training-api.js"></script>
<script src="/static/training/train/train.js"></script>
</body>
</html>
